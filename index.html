<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181818" />
    <meta
      name="description"
      content="ATOM: captura tu pose con la webcam y transfierela a un maniqui, un esqueleto o una figura anatomica con control total de camara y luz."
    />
    <title>ATOM</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181818'/%3E%3Cpath d='M16 6a2.6 2.6 0 1 1 0 5.2A2.6 2.6 0 0 1 16 6Zm-6 7.4h12v2.4h-3.7l1.5 10h-2.6l-1.2-7.4-1.2 7.4h-2.6l1.5-10H10v-2.4Z' fill='%234daafc'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app" class="app" aria-busy="true">
      <!-- Las secciones viven en la fila de iconos del panel lateral y los mandos
           en la barra vertical que flota en el borde del visor. El texto de
           estado se muestra en la lectura del borde inferior. -->
      <div class="workbench">
        <!-- ── Panel lateral ──────────────────────────────────────────── -->
        <aside class="sidebar" id="sidebar">
          <!-- Cambio de seccion: un icono por panel, sin desplegar nada. La fila
               la rellena ui/UI.js desde `buildPanels`, asi que anadir o quitar un
               panel no obliga a tocar este marcado. -->
          <nav class="sidebar-tabs" id="sidebar-tabs" aria-label="Secciones"></nav>
          <div class="sidebar-header">
            <span id="sidebar-title">Figura</span>
            <button class="icon-btn" id="sidebar-collapse" title="Ocultar panel (H)" data-icon="panel-left-close"></button>
          </div>
          <div class="sidebar-scroll" id="sidebar-host"></div>
        </aside>

        <!-- ── Visor 3D ───────────────────────────────────────────────── -->
        <main class="viewport" id="viewport">
          <canvas id="gl-canvas"></canvas>
          <canvas id="guide-canvas" class="overlay-canvas"></canvas>
          <!-- Lapiz: un lienzo con lo ya trazado y otro con el trazo en curso.
               No reciben eventos: el puntero lo atrapa draw/Sketch.js en la fase
               de captura del documento, para adelantarse a la orbita. -->
          <canvas id="sketch-canvas" class="overlay-canvas sketch-canvas"></canvas>
          <canvas id="sketch-live" class="overlay-canvas sketch-canvas"></canvas>

          <!-- Dos columnas flotantes: las herramientas y, al lado, las opciones
               de la que este elegida. Las rellena ui/UI.js. -->
          <div class="viewport-tools" id="viewport-tools">
            <div class="viewport-toolbar" id="viewport-toolbar"></div>
            <div class="viewport-toolbar is-options" id="viewport-options"></div>
          </div>
          <div class="viewport-badge" id="viewport-badge"></div>
          <div class="viewport-readout" id="viewport-readout"></div>

          <!-- Monitor de captura, arrastrable -->
          <section class="mocap-hud hidden" id="mocap-hud" aria-label="Monitor de captura">
            <header class="mocap-hud-head" id="mocap-hud-drag">
              <span data-icon="video"></span>
              <span class="mocap-hud-title">Captura</span>
              <span class="mocap-hud-fps" id="mocap-fps">—</span>
              <button class="icon-btn tiny" id="mocap-hud-close" title="Cerrar monitor" data-icon="x"></button>
            </header>
            <div class="mocap-hud-body">
              <video id="mocap-video" playsinline muted></video>
              <img id="mocap-image" alt="" />
              <canvas id="mocap-overlay"></canvas>
            </div>
            <span class="mocap-grip nw" data-grip="nw" title="Redimensionar (doble clic: tamano y sitio por defecto)"></span>
            <span class="mocap-grip ne" data-grip="ne" title="Redimensionar (doble clic: tamano y sitio por defecto)"></span>
            <span class="mocap-grip sw" data-grip="sw" title="Redimensionar (doble clic: tamano y sitio por defecto)"></span>
            <span class="mocap-grip se" data-grip="se" title="Redimensionar (doble clic: tamano y sitio por defecto)"></span>
          </section>

          <!-- Buscador de imagenes de referencia (Espacio). Lo monta ui/SearchBar.js -->
          <section class="imgsearch hidden" id="imgsearch" aria-label="Buscador de imagenes"></section>

          <div class="drop-hint" id="drop-hint">
            <span data-icon="upload"></span>
            <p>Suelta un <b>.glb</b> / <b>.fbx</b> para cargar tu figura, o una <b>imagen</b> para extraer su pose</p>
          </div>
        </main>
      </div>

      <!-- ── Pantalla de carga ─────────────────────────────────────────── -->
      <div class="boot" id="boot">
        <div class="boot-card">
          <div class="boot-logo" data-icon="person-standing"></div>
          <h1>ATOM</h1>
          <div class="boot-bar"><i id="boot-bar-fill"></i></div>
          <p class="boot-msg" id="boot-msg">Iniciando motor 3D…</p>
        </div>
      </div>

      <div class="toasts" id="toasts" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
